name: Build Tata WMS Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Native Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Synchronize Capacitor Android Platform
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK Artifact
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./Tata-AutoComp-WMS-v1.0.apk

      - name: Upload APK as Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tata-AutoComp-WMS-Android-APK
          path: ./Tata-AutoComp-WMS-v1.0.apk
          retention-days: 30

      - name: Create Release with Downloadable APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-apk
          name: 'Tata AutoComp WMS Mobile App v1.0'
          body: |
            ### 📱 Tata AutoComp Lithium Battery WMS - Android Application
            - **Plant:** Varale (B300 Plant) & Chakan
            - **App Version:** 1.0.0
            - **Target:** Android Phones, Tablets & Handheld Barcode Scanners (Zebra / Honeywell PDA)
            - **Features:** Direct Barcode Scanning, Live Supabase Cloud Sync, Offline Access
          files: ./Tata-AutoComp-WMS-v1.0.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
