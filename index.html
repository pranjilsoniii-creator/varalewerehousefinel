    <script>
      // Self-Healing Watchdog: Prevents white screen if browser loaded stale cache pointing to obsolete JS hashes
      window.addEventListener('error', function (e) {
        if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
          console.warn('Tata WMS: Stale chunk load error detected. Refreshing cache...', e);
          if (!sessionStorage.getItem('tata_wms_sw_recovered')) {
            sessionStorage.setItem('tata_wms_sw_recovered', Date.now().toString());
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                for (var i = 0; i < regs.length; i++) {
                  regs[i].unregister();
                }
                if ('caches' in window) {
                  caches.keys().then(function (names) {
                    for (var j = 0; j < names.length; j++) {
                      caches.delete(names[j]);
                    }
                    window.location.reload();
                  });
                } else {
                  window.location.reload();
                }
              });
            } else {
              window.location.reload();
            }
          }
        }
      }, true);
    </script>
